spring.application.name=movie

# 로컬 실행 시 프로젝트 루트의 .env 파일에서 값을 읽음 (배포 환경에서는 환경변수로 주입)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

tmdb.api-key=${TMDB_API_KEY}

# Gemini (Spring AI)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# 측정 결과 flash는 응답에 30~40초, flash-lite는 약 4초 → 영화 추천에는 가벼운 모델로 충분
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# 영화 추천은 깊은 추론이 필요 없으므로 생각(thinking) 수준을 최소로 해 지연과 토큰을 줄인다
spring.ai.google.genai.chat.options.thinking-level=MINIMAL

# 추천에 쓸 AI: luxia(기본, 솔트룩스 LUXIA Cloud) 또는 gemini(도구 호출)
ai.provider=${AI_PROVIDER:luxia}
luxia.api-key=${LUXIA_API_KEY:}
luxia.model=luxia3-llm-8b-0731

# AI 추천 API 사용량 제한 (IP당 하루 호출 수)
ai.daily-limit=${AI_DAILY_LIMIT:20}

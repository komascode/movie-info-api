# 앱과 MySQL을 함께 실행
# 값은 같은 폴더의 .env에서 읽음 (DB_PASSWORD, TMDB_API_KEY)
services:
  db:
    image: mysql:8.0
    container_name: movie-db
    environment:
      MYSQL_DATABASE: movie_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - movie-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: movie-app
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름(db)으로 MySQL에 접속
      DB_URL: jdbc:mysql://db:3306/movie_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  movie-db-data:
